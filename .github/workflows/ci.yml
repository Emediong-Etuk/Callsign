name: CI
on:
  push:
  pull_request:

jobs:
  verify-all:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Rust toolchain (from contracts/rust-toolchain.toml)
        working-directory: contracts
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      # The sandbox tests compile the contracts with `cargo near` (near-workspaces
      # calls the CLI). Built from crates.io; the cache keeps ~/.cargo/bin between runs.
      - name: Install cargo-near
        run: cargo near --version 2>/dev/null || cargo install --locked cargo-near@0.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm install
      - name: verify:all (no secrets, no wallet, no testnet)
        run: npm run verify:all
